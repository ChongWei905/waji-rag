  <title>E00131 GPS一级锁车</title>

<body>
  <h1>E00131 GPS一级锁车</h1>
  <p>故障代码 E00131 表示 GPS 一级锁车状态。机器可能因定位、通信或授权状态异常进入限制状态。</p>
  <h2>检查方法</h2>
  <ol>
    <li>检查 GPS 终端供电和通信连接。</li>
    <li>确认平台授权状态是否正常。</li>
    <li>检查相关保险和线束插接件。</li>
  </ol>
  <h2>处理方法</h2>
  <p>恢复通信和授权后清除故障码；若终端损坏，应按配件目录更换 GPS 终端。</p>
</body>
