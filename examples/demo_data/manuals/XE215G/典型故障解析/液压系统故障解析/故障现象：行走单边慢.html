  <title>故障现象：行走单边慢</title>
  <style>.font12 { font-size: 12px; color: #444; }</style>

<body>
  <h1>故障现象：行走单边慢</h1>
  <p>单侧行走速度明显偏慢，可能涉及行走马达、主泵供油、先导压力、中心回转接头或行走控制阀。</p>
  <h2>可能原因</h2>
  <ul>
    <li>行走马达内泄过大。</li>
    <li>行走溢流阀卡滞或设定压力异常。</li>
    <li>主泵对应油路压力不足。</li>
    <li>履带机械阻力过大。</li>
  </ul>
  <h2>处理方法</h2>
  <p>先进行左右互换或压力对比测试，确认液压压力和回油情况，再拆检行走马达或控制阀。</p>
</body>
</html>
