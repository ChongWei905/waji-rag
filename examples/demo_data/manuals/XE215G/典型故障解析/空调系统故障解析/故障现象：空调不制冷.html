<body>
  <h1>故障现象：空调不制冷</h1>
  <p>空调出风正常但温度不下降时，应检查冷媒压力、冷凝器散热、压缩机吸合状态和干燥瓶通畅情况。</p>
  <h2>可能原因</h2>
  <ul>
    <li>冷媒不足或泄漏。</li>
    <li>冷凝器堵塞导致散热不良。</li>
    <li>干燥瓶堵塞。</li>
    <li>压缩机离合器或控制线路异常。</li>
  </ul>
  <h2>处理方法</h2>
  <p>清洗冷凝器，检查压力和泄漏点；确认干燥瓶堵塞时更换干燥瓶并补充冷媒。</p>
